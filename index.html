<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Product Catalog</h1>
        <p>Browse our latest products</p>
    </header>

    <main class="products">

        <div class="product-card">
            <h2>Wireless Headphones</h2>
            <p>High-quality wireless headphones with noise cancellation.</p>
            <h3>₹2,999</h3>
            <button onclick="addToCart('Wireless Headphones')">
                Add to Cart
            </button>
        </div>

        <div class="product-card">
            <h2>Smart Watch</h2>
            <p>Track your fitness, notifications and daily activities.</p>
            <h3>₹4,499</h3>
            <button onclick="addToCart('Smart Watch')">
                Add to Cart
            </button>
        </div>

        <div class="product-card">
            <h2>Bluetooth Speaker</h2>
            <p>Portable speaker with powerful sound and long battery life.</p>
            <h3>₹1,999</h3>
            <button onclick="addToCart('Bluetooth Speaker')">
                Add to Cart
            </button>
        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
